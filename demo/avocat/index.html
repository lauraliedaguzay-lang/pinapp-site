<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="../../assets/css/demo-sector.css">
  <script>
  window.PINAPP_DEMO_SITE = {
    nom: "Cabinet Renaud",
    slogan: "Votre expertise mérite",
    sousSlogan: "une présence à sa hauteur.",
    zone: "Barreau de Lyon", secteur: "Cabinet d'avocats",
    accent: "#C9A96E", accentDark: "#A88950",
    fond: "#0A0A0A", texte: "#F0ECE4",
    typo: "Georgia", style: "dark-luxury",
    photoHero: "hero-avocat.webp",
    cta: "Prendre rendez-vous",
    services: [
      { nom: "Droit des affaires", prix: "Consultation sur RDV",
        description: "Création, contrats, litiges commerciaux." },
      { nom: "Droit du travail", prix: "Consultation sur RDV",
        description: "Employeurs et salariés. Contentieux." },
      { nom: "Contentieux", prix: "Devis selon dossier",
        description: "Représentation devant toutes juridictions." }
    ],
    confiance: ["Barreau de Lyon", "15 ans d'expérience [DÉMO]", "Réponse sous 24h garantie"],
    avis: "Cabinet sérieux et réactif. Dossier traité avec rigueur.",
    avisAuteur: "Pierre M., Directeur [DÉMO]",
    q1: { label: "Domaine juridique ?",
      options: ["Droit des affaires", "Droit du travail", "Contentieux", "Autre"] },
    q2: { label: "Vous êtes ?",
      options: ["Particulier", "Entreprise", "Association"] },
    q3: { label: "Urgence ?",
      options: ["Urgent", "Cette semaine", "Je prends le temps"] },
    confirmation: "Consultation confirmée. Réponse sous 24h.",
    metaTitle: "Cabinet Renaud — Avocat Lyon",
    metaDesc: "Exemple site cabinet avocat — Démonstration Pinapp Studio",
    h1Hidden: "Avocat droit des affaires Lyon — Cabinet Renaud",
    bookingTitle: "Demande de rendez-vous"
  };
  </script>
  <script src="../../assets/js/demo-sector.js" defer></script>
</head>
<body class="demo-sector-page">
  <a href="#main-demo" class="demo-skip">Aller au contenu</a>
  <div class="demo-live-banner" role="banner">
    <span class="live-dot" aria-hidden="true"></span>
    DÉMONSTRATION PINAPP — Contenu fictif illustratif
  </div>

  <main id="main-demo">
    <section class="hero" aria-label="Accroche">
      <div class="hero-content">
        <p class="hero-label"><span id="heroSecteur"></span> · <span id="heroZone"></span></p>
        <h1 class="hero-title" id="heroSlogan"></h1>
        <p class="hero-sub" id="heroSous"></p>
        <button type="button" class="btn-hero" id="btnBooking"></button>
      </div>
    </section>

    <section class="services-section" aria-label="Prestations">
      <p class="services-title">Nos prestations</p>
      <p class="services-subtitle">Faites défiler ou swipez</p>
      <div class="swipe-container" id="servicesSwipe"></div>
      <div class="swipe-dots" id="servicesDots"></div>
    </section>

    <section class="preuve-section" aria-label="Témoignage">
      <div style="max-width:560px;">
        <p class="preuve-avis" id="preuveAvis"></p>
        <p class="preuve-auteur" id="preuveAuteur"></p>
        <p class="demo-label">Témoignage illustratif — DÉMO</p>
        <div class="badges"></div>
      </div>
    </section>

    <section class="booking-section" id="booking" aria-label="Réservation">
      <p class="booking-title" id="bookingTitle">Demande de rendez-vous</p>
      <p class="booking-sub">Quelques secondes suffisent.</p>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="questions-wrapper">
        <div class="question active" id="q1">
          <p class="question-label" id="l1"></p>
          <div class="pills" id="pills1"></div>
        </div>
        <div class="question" id="q2">
          <p class="question-label" id="l2"></p>
          <div class="pills" id="pills2"></div>
        </div>
        <div class="question" id="q3">
          <p class="question-label" id="l3"></p>
          <div class="pills" id="pills3"></div>
        </div>
        <div class="question" id="qfin">
          <div class="confirmation">
            <svg class="check-circle" id="checkCircle" viewBox="0 0 56 56" fill="none" aria-hidden="true">
              <circle cx="28" cy="28" r="26" stroke="#39E075" stroke-width="2"/>
              <polyline points="16,28 24,36 40,20" stroke="#39E075" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <p class="confirm-text" id="confirmText"></p>
            <p class="confirm-sub">Vous serez contacté(e) sous 24h.</p>
            <p class="demo-label" style="margin-top:8px;">Démonstration — Aucune donnée transmise</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span><span id="footNom"></span> · <span id="footZone"></span></span>
    <span style="display:flex;align-items:center;gap:12px;">
      <a class="pinapp-back" href="https://pinapp.fr/">Pinapp Studio</a>
      <span class="footer-demo">Démo</span>
    </span>
  </footer>

</body>
</html>
