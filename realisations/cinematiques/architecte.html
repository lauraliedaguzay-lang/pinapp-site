<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Rivage — Architecture d'exception · Démo Pinapp</title>
<meta name="description" content="Démonstration immersive pour cabinet d'architecture. Créé par Pinapp, studio digital à Bordeaux.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0c0c0a;font-family:'Outfit',sans-serif;color:#fff;cursor:default}
::selection{background:#C8A87A;color:#fff}
img{display:block}

/* === SLIDES === */
.slide{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity 1.4s cubic-bezier(.4,0,.2,1),visibility 0s 1.4s;overflow:hidden;z-index:1}
.slide.active{opacity:1;visibility:visible;transition:opacity 1.4s cubic-bezier(.4,0,.2,1),visibility 0s 0s;z-index:2}
.slide__img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;will-change:transform;filter:brightness(.45) saturate(.85);transition:transform .12s ease-out}
.slide.active .slide__img{animation:kenburns 20s ease-in-out alternate infinite}
@keyframes kenburns{0%{transform:scale(1.04)}100%{transform:scale(1.12) translate(-0.5%,-0.3%)}}
.slide__overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,12,10,.2) 0%,transparent 35%,transparent 55%,rgba(12,12,10,.92) 100%)}
.slide__vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(12,12,10,.45) 100%);pointer-events:none}

/* === NAV === */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.6rem 3.2rem;display:flex;justify-content:space-between;align-items:center;transition:background .5s,padding .5s}
.nav.scrolled{background:rgba(12,12,10,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:1rem 3.2rem}
.nav__logo{font-family:'Cormorant Garamond',serif;font-size:1.35rem;letter-spacing:.17em;font-weight:300;color:#fff;text-decoration:none}
.nav__links{display:flex;gap:2.4rem}
.nav__links a{color:rgba(255,255,255,.38);text-decoration:none;font-size:.56rem;letter-spacing:.17em;text-transform:uppercase;font-weight:300;transition:color .35s}
.nav__links a:hover{color:#C8A87A}

/* === CONTENT BOTTOM === */
.content{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:0 4rem 4.5rem;pointer-events:none}
.content>*{pointer-events:all}
.eyebrow{font-size:.48rem;letter-spacing:.38em;text-transform:uppercase;color:#C8A87A;margin-bottom:1.1rem;opacity:0;transform:translateY(12px);transition:all .7s ease}
.eyebrow.show{opacity:1;transform:none}
.title{font-family:'Cormorant Garamond',serif;font-weight:300;line-height:1.05;text-shadow:0 2px 50px rgba(0,0,0,.35);opacity:0;transform:translateY(20px);transition:all .8s cubic-bezier(.4,0,.2,1) .1s}
.title.show{opacity:1;transform:none}
.title--hero{font-size:clamp(2.6rem,6.5vw,5.2rem)}
.title--project{font-size:clamp(1.9rem,4.5vw,3.2rem)}
.title em{font-style:italic;color:#e8d5b8}
.subtitle{font-size:.8rem;color:rgba(255,255,255,.48);margin-top:.55rem;font-weight:200;opacity:0;transform:translateY(10px);transition:all .6s ease .2s}
.subtitle.show{opacity:1;transform:none}

/* === THUMBS === */
.thumbs{display:flex;gap:.55rem;margin-top:2.2rem;align-items:flex-end}
.thumb{width:68px;height:44px;border-radius:4px;overflow:hidden;cursor:pointer;border:2px solid rgba(255,255,255,.07);transition:all .55s cubic-bezier(.4,0,.2,1);opacity:.35;flex-shrink:0}
.thumb.active{width:118px;height:72px;border-color:#C8A87A;opacity:1}
.thumb img{width:100%;height:100%;object-fit:cover;transition:filter .4s}
.thumb:not(.active) img{filter:brightness(.45) saturate(.35)}
.thumb:hover:not(.active){opacity:.6}

/* === ARROWS === */
.arrows{display:flex;gap:.5rem;margin-top:1.1rem;align-items:center}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .3s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.arrow:hover{border-color:#C8A87A;color:#C8A87A;background:rgba(200,168,122,.06)}
.counter{font-size:.46rem;color:rgba(255,255,255,.18);margin-left:.6rem;letter-spacing:.12em;font-variant-numeric:tabular-nums}

/* === DOTS === */
.dots{position:fixed;right:1.4rem;top:50%;transform:translateY(-50%);z-index:80;display:flex;flex-direction:column;gap:.45rem}
.dot{width:3px;height:7px;border-radius:1.5px;background:rgba(255,255,255,.1);cursor:pointer;transition:all .5s cubic-bezier(.4,0,.2,1)}
.dot.active{height:20px;background:#C8A87A}
.dot:hover:not(.active){background:rgba(255,255,255,.25)}

/* === NUMBER === */
.slide-num{position:fixed;top:50%;right:3rem;transform:translateY(-50%);writing-mode:vertical-rl;font-size:.46rem;letter-spacing:.2em;color:rgba(255,255,255,.12);text-transform:uppercase;z-index:60;transition:opacity .4s}

/* === SCROLL HINT === */
.scroll-hint{margin-top:2.4rem;display:flex;align-items:center;gap:.55rem}
.scroll-hint svg{opacity:.3;animation:bob 2.5s ease-in-out infinite}
.scroll-hint span{font-size:.46rem;letter-spacing:.12em;color:rgba(255,255,255,.22);text-transform:uppercase}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* === BADGE === */
.badge{position:fixed;bottom:.9rem;right:1.4rem;z-index:90;display:flex;align-items:center;gap:.4rem;padding:.32rem .8rem;background:rgba(12,12,10,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.05);border-radius:100px;text-decoration:none;transition:border-color .3s}
.badge:hover{border-color:rgba(200,168,122,.25)}
.badge__dot{width:4px;height:4px;border-radius:50%;background:#6BAF8D;animation:pulse 2.5s infinite}
.badge__text{font-size:.42rem;color:rgba(255,255,255,.22);letter-spacing:.1em;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}

/* === RESPONSIVE === */
@media(max-width:768px){
  .nav{padding:1rem 1.4rem}
  .nav__links{display:none}
  .content{padding:0 1.6rem 3rem}
  .title--hero{font-size:2.4rem}
  .title--project{font-size:1.7rem}
  .thumb{width:48px;height:32px}
  .thumb.active{width:82px;height:52px}
  .slide-num{display:none}
  .dots{right:.8rem}
}
@media (prefers-reduced-motion:reduce){
  .slide.active .slide__img{animation:none}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <a href="https://pinapp.fr" class="nav__logo">Atelier Rivage</a>
  <div class="nav__links">
    <a href="#">Villas</a>
    <a href="#">L'atelier</a>
    <a href="#">Contact</a>
  </div>
</nav>

<!-- SLIDES -->
<div id="slides"></div>

<!-- SLIDE NUMBER -->
<div class="slide-num" id="slideNum">01 / 06</div>

<!-- CONTENT -->
<div class="content">
  <p class="eyebrow" id="eyebrow">Architecture résidentielle · Bordeaux & Littoral atlantique</p>
  <h1 class="title title--hero" id="title">Entrez dans<br>nos <em>créations.</em></h1>
  <p class="subtitle" id="subtitle">Naviguez à travers nos villas d'exception</p>

  <div class="thumbs" id="thumbs"></div>

  <div class="arrows">
    <button class="arrow" id="prev" aria-label="Projet précédent">&#8592;</button>
    <button class="arrow" id="next" aria-label="Projet suivant">&#8594;</button>
    <span class="counter" id="counter">01 / 06</span>
  </div>

  <div class="scroll-hint" id="scrollHint">
    <svg width="18" height="28" viewBox="0 0 18 28" fill="none"><rect x="1" y="1" width="16" height="26" rx="8" stroke="rgba(255,255,255,.25)" stroke-width="1.2"/><circle cx="9" cy="9" r="1.8" fill="rgba(255,255,255,.4)"><animate attributeName="cy" values="8;18;8" dur="2.2s" repeatCount="indefinite"/></circle></svg>
    <span>Scroll ou cliquez</span>
  </div>
</div>

<!-- DOTS -->
<div class="dots" id="dots"></div>

<!-- BADGE -->
<a href="https://pinapp.fr" target="_blank" rel="noopener" class="badge">
  <span class="badge__dot"></span>
  <span class="badge__text">Créé par Pinapp</span>
</a>

<script>
/* ======= DATA ======= */
var DATA = [
  {t:"Villa Lumière", l:"Cap Ferret · 480 m²", d:"Piscine à débordement face à l'Atlantique. Béton blanc, bois de cèdre et baies vitrées plein sud.", i:"photo-1613490493576-7fde63acd811"},
  {t:"Les Jardins Suspendus", l:"Biarritz · 350 m²", d:"Terrasses végétalisées en cascade surplombant la côte basque.", i:"photo-1512917774080-9991f1c4c750"},
  {t:"Maison Pierre", l:"Saint-Émilion · 420 m²", d:"Chai réhabilité en résidence contemporaine. Pierre blonde et acier noir.", i:"photo-1600596542815-ffad4c1539a9"},
  {t:"Villa Éclipse", l:"Arcachon · 290 m²", d:"Infinity pool surplombant le Bassin. Architecture bioclimatique.", i:"photo-1582268611958-ebfd161ef9cf"},
  {t:"L'Intérieur", l:"Bordeaux · 260 m²", d:"Double hauteur, verrière zénithale, béton ciré. Lumière naturelle absolue.", i:"photo-1600607687939-ce8a6c25118c"},
  {t:"Horizon Bleu", l:"Hossegor · 310 m²", d:"Face à l'océan. Bois flotté, lin et pierre. Une maison qui respire.", i:"photo-1574739782594-db4ead022697"}
];

var cur = 0;
var slidesEl = document.getElementById('slides');
var thumbsEl = document.getElementById('thumbs');
var dotsEl = document.getElementById('dots');
var titleEl = document.getElementById('title');
var subtitleEl = document.getElementById('subtitle');
var eyebrowEl = document.getElementById('eyebrow');
var counterEl = document.getElementById('counter');
var slideNumEl = document.getElementById('slideNum');
var scrollHintEl = document.getElementById('scrollHint');
var nav = document.getElementById('nav');

/* ======= BUILD SLIDES ======= */
DATA.forEach(function(d, i) {
  /* Slide */
  var s = document.createElement('div');
  s.className = 'slide' + (i === 0 ? ' active' : '');
  var img = document.createElement('img');
  img.className = 'slide__img';
  img.src = 'https://images.unsplash.com/' + d.i + '?w=1920&q=85';
  img.alt = d.t;
  if (i > 0) img.loading = 'lazy';
  s.appendChild(img);
  var ov = document.createElement('div'); ov.className = 'slide__overlay'; s.appendChild(ov);
  var vi = document.createElement('div'); vi.className = 'slide__vignette'; s.appendChild(vi);
  slidesEl.appendChild(s);

  /* Thumb */
  var th = document.createElement('div');
  th.className = 'thumb' + (i === 0 ? ' active' : '');
  var ti = document.createElement('img');
  ti.src = 'https://images.unsplash.com/' + d.i + '?w=300&q=60';
  ti.alt = d.t;
  ti.loading = 'lazy';
  th.appendChild(ti);
  th.addEventListener('click', function() { goTo(i); });
  thumbsEl.appendChild(th);

  /* Dot */
  var dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', function() { goTo(i); });
  dotsEl.appendChild(dot);
});

var slides = document.querySelectorAll('.slide');
var thumbs = thumbsEl.children;
var dots = dotsEl.children;

/* ======= SHOW TEXT ======= */
function showText() {
  eyebrowEl.classList.add('show');
  titleEl.classList.add('show');
  subtitleEl.classList.add('show');
}
function hideText(cb) {
  eyebrowEl.classList.remove('show');
  titleEl.classList.remove('show');
  subtitleEl.classList.remove('show');
  setTimeout(cb, 400);
}

/* Show initial text */
setTimeout(showText, 300);

/* ======= NAVIGATION ======= */
function goTo(n) {
  if (n === cur) return;
  hideText(function() {
    slides[cur].classList.remove('active');
    thumbs[cur].classList.remove('active');
    dots[cur].classList.remove('active');

    cur = n;

    slides[cur].classList.add('active');
    thumbs[cur].classList.add('active');
    dots[cur].classList.add('active');

    if (cur === 0) {
      titleEl.className = 'title title--hero';
      titleEl.innerHTML = 'Entrez dans<br>nos <em>créations.</em>';
      subtitleEl.textContent = "Naviguez à travers nos villas d'exception";
      eyebrowEl.style.display = 'block';
      scrollHintEl.style.display = 'flex';
    } else {
      titleEl.className = 'title title--project';
      titleEl.textContent = DATA[cur].t;
      subtitleEl.textContent = DATA[cur].l + ' — ' + DATA[cur].d;
      eyebrowEl.style.display = 'none';
      scrollHintEl.style.display = 'none';
    }

    counterEl.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(DATA.length).padStart(2, '0');
    slideNumEl.textContent = String(cur + 1).padStart(2, '0') + ' / ' + String(DATA.length).padStart(2, '0');

    slides.forEach(function (sl) {
      var im = sl.querySelector('.slide__img');
      if (im) im.style.transform = '';
    });
    if (cur > 0) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');

    setTimeout(showText, 100);
  });
}

document.getElementById('prev').addEventListener('click', function() {
  goTo(cur > 0 ? cur - 1 : DATA.length - 1);
});
document.getElementById('next').addEventListener('click', function() {
  goTo(cur < DATA.length - 1 ? cur + 1 : 0);
});

/* ======= PARALLAX SOURIS (override Ken Burns pendant le mouvement) ======= */
var mx = 0.5,
  my = 0.5,
  raf,
  lastMouseMove = 0;
var parallaxIdleMs = 120;
function updateParallax() {
  var img = slides[cur] && slides[cur].querySelector('.slide__img');
  if (img) {
    if (Date.now() - lastMouseMove < parallaxIdleMs) {
      var x = (mx - 0.5) * -18;
      var y = (my - 0.5) * -10;
      img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(1.06)';
    } else {
      img.style.transform = '';
    }
  }
  raf = requestAnimationFrame(updateParallax);
}
document.addEventListener('mousemove', function (e) {
  lastMouseMove = Date.now();
  mx = e.clientX / window.innerWidth;
  my = e.clientY / window.innerHeight;
});
raf = requestAnimationFrame(updateParallax);

/* ======= KEYBOARD ======= */
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goTo(cur < DATA.length - 1 ? cur + 1 : 0); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(cur > 0 ? cur - 1 : DATA.length - 1); }
});

/* ======= SCROLL WHEEL ======= */
var scrollThrottle = false;
document.addEventListener('wheel', function(e) {
  if (scrollThrottle) return;
  scrollThrottle = true;
  setTimeout(function() { scrollThrottle = false; }, 800);
  if (e.deltaY > 0) goTo(cur < DATA.length - 1 ? cur + 1 : 0);
  else goTo(cur > 0 ? cur - 1 : DATA.length - 1);
}, { passive: true });

/* ======= TOUCH SWIPE ======= */
var touchY = 0;
document.addEventListener('touchstart', function(e) { touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', function(e) {
  var diff = e.changedTouches[0].clientY - touchY;
  if (Math.abs(diff) > 40) {
    if (diff < 0) goTo(cur < DATA.length - 1 ? cur + 1 : 0);
    else goTo(cur > 0 ? cur - 1 : DATA.length - 1);
  }
}, { passive: true });

/* ======= REDUCED MOTION ======= */
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  cancelAnimationFrame(raf);
}
</script>
</body>
</html>
