[build]
  functions = "netlify/functions"

# Enterrement versions parallèles (V8.3) — avant les autres [[redirects]]
[[redirects]]
  from = "/home-classic/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home-classic/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/archive/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pinapp-site-vitrine/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/pinapp-site-vitrine/*"
  to = "/"
  status = 301
  force = true

# Forcer HTTPS + canonique sans www (évite « Non sécurisé » sur http:// ou www)
[[redirects]]
  from = "http://pinapp.fr/*"
  to = "https://pinapp.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.pinapp.fr/*"
  to = "https://pinapp.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.pinapp.fr/*"
  to = "https://pinapp.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/formation/"
  to = "/formation-gratuite/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/"
  [headers.values]
    Link = """
</assets/img/voyage/film-posters/00-ouverture.jpg>; \
rel=preload; as=image; fetchpriority=high, \
</assets/fonts/geist-sans-500.woff2>; \
rel=preload; as=font; crossorigin, \
</assets/css/tokens-voyage.css>; rel=preload; as=style, \
</assets/css/ouverture-v50.css>; rel=preload; as=style"""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "cross-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' https://assets.calendly.com https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://plausible.io https://calendly.com https://*.n8n.cloud https://*.make.com https://api.web3forms.com; frame-src https://calendly.com 'self'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/interne/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
