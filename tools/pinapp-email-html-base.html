<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabarit e-mail Pinapp Studio (référence n8n / client)</title>
    <!--
      Usage : copier le bloc <table> dans un nœud « Send email » HTML (n8n, Make, etc.).
      Cohérence graphique site : fond #020807, accent #00e5cc, texte #eef8ff.
      Remplacer {{TITRE}}, {{SOUS_TITRE}}, {{CORPS_HTML}}, {{LIEN_CTA}}, {{TEXTE_CTA}}.
    -->
  </head>
  <body style="margin: 0; padding: 0; background-color: #0a1210">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="
        background-color: #0a1210;
        padding: 24px 12px;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      ">
      <tr>
        <td align="center">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="
              max-width: 560px;
              background-color: #020807;
              border-radius: 16px;
              border: 1px solid rgba(0, 229, 204, 0.12);
              overflow: hidden;
            ">
            <tr>
              <td style="padding: 28px 28px 8px; text-align: center">
                <p
                  style="margin: 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #00e5cc">
                  Pinapp Studio
                </p>
                <h1
                  style="margin: 12px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #eef8ff">
                  {{TITRE}}
                </h1>
                <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.55; color: rgba(238, 248, 255, 0.72)">
                  {{SOUS_TITRE}}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 28px 24px">
                <div style="height: 1px; background: rgba(0, 229, 204, 0.12); margin: 16px 0"></div>
                <div style="font-size: 15px; line-height: 1.65; color: rgba(238, 248, 255, 0.88)">{{CORPS_HTML}}</div>
                <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin-top: 28px">
                  <tr>
                    <td align="center">
                      <a
                        href="{{LIEN_CTA}}"
                        style="
                          display: inline-block;
                          padding: 14px 28px;
                          border-radius: 100px;
                          background-color: #00e5cc;
                          color: #020807;
                          font-size: 14px;
                          font-weight: 600;
                          text-decoration: none;
                          letter-spacing: 0.04em;
                        "
                        >{{TEXTE_CTA}}</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 28px 28px; text-align: center">
                <p style="margin: 0; font-size: 12px; line-height: 1.5; color: rgba(238, 248, 255, 0.45)">
                  Service client premium par écrit — Lauralie &amp; Michaël<br />
                  <a href="https://pinapp.fr" style="color: #00e5cc; text-decoration: none">pinapp.fr</a>
                  &nbsp;·&nbsp;
                  <a href="mailto:lauralie.daguzay@pinapp.fr" style="color: #00e5cc; text-decoration: none"
                    >lauralie.daguzay@pinapp.fr</a
                  >
                </p>
              </td>
            </tr>
          </table>
          <p style="margin: 16px 0 0; font-size: 11px; color: rgba(238, 248, 255, 0.35); max-width: 480px">
            Vous recevez ce message dans le cadre de votre demande Pinapp. Réponse sous 24 h (jours ouvrés)
            lorsqu’indiqué sur le site.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
