<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hors ligne — Pinapp Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020810;
      color: #EEF8FF;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      text-align: center;
      padding: 24px;
    }
    .icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(0,229,204,0.10);
      border: 1px solid rgba(0,229,204,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 24px;
    }
    h1 { font-size: clamp(22px,4vw,36px); font-weight: 300; margin-bottom: 16px; letter-spacing: -0.02em; }
    p { color: rgba(238,248,255,0.55); font-size: 16px; line-height: 1.6; margin-bottom: 32px; font-family: -apple-system, sans-serif; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(0,229,204,0.12);
      border: 1px solid rgba(0,229,204,0.30);
      color: #00E5CC;
      border-radius: 100px;
      text-decoration: none;
      font-size: 14px;
      font-family: -apple-system, sans-serif;
      transition: background 200ms ease;
    }
    a:hover { background: rgba(0,229,204,0.20); }
  </style>
</head>
<body>
  <div>
    <div class="icon">&#x1F4F6;</div>
    <h1>Vous &ecirc;tes hors ligne.</h1>
    <p>Reconnectez-vous pour acc&eacute;der &agrave; Pinapp Studio.</p>
    <a href="/" onclick="location.reload()">R&eacute;essayer &rarr;</a>
  </div>
</body>
</html>
