<!doctype html>
<html lang="fr" data-theme="dark" data-pinapp-no-cookie="1">
  <head>
    <script>
      (function () {
        var s = localStorage.getItem('pinapp-theme');
        var d = window.matchMedia('(prefers-color-scheme:dark)').matches;
        var m = s || 'nuit';
        document.documentElement.setAttribute('data-mode', m);
        document.documentElement.setAttribute('data-theme', m === 'jour' ? 'light' : 'dark');
        if (document.body) document.body.classList.add('mode-' + m);
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('mode-' + m);
        });
      })();
    </script>
    <link rel="preload" as="image" href="assets/images/bg-dark-pandora-apple.png" fetchpriority="high" />
    <link rel="preload" as="image" href="assets/images/bg-light-pandora-apple.png" />
    <meta charset="UTF-8" />

    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .og-card {
        width: 1200px;
        height: 630px;
        max-width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        text-align: center;
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: var(--radius-card-lg);
      }
      .og-card h1 {
        font-size: 3rem;
        letter-spacing: -0.02em;
      }
      .og-card p {
        font-size: 1.25rem;
        opacity: 0.7;
        max-width: 36rem;
      }
      .og-card .og-brand-logo {
        width: auto;
        height: 5.5rem;
        max-width: 22rem;
        object-fit: contain;
      }
    </style>
    <link rel="stylesheet" href="assets/css/pandora-dance.css" />
    <link rel="stylesheet" href="assets/css/ios-glass.css" />
    <link rel="stylesheet" href="assets/css/apple-finish.css" />
    <link rel="stylesheet" href="assets/css/pinapp-modern-biolume.css" />
    <link rel="stylesheet" href="assets/css/pinapp-premium.css" />
    <link rel="stylesheet" href="/assets/css/pinapp-master-v3.css" />
    <link rel="stylesheet" href="/assets/css/pinapp-master-v4.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Aller au contenu</a>
    <div id="pandora-loader" class="pinapp-cinema-loader" aria-hidden="true">
      <div class="pinapp-cinema-loader__aurora" aria-hidden="true"></div>
      <div class="pinapp-cinema-loader__video-wrap">
        <video
          class="pinapp-cinema-loader__video"
          autoplay
          muted
          playsinline
          loop
          preload="metadata"
          poster="/assets/images/bg-pandora-nuit.png">
          <source src="/assets/video/pinapp-loader-intro.webm" type="video/webm" />
          <source src="/assets/video/pinapp-loader-intro.mp4" type="video/mp4" />
        </video>
        <div class="pinapp-cinema-loader__veil" aria-hidden="true"></div>
        <div class="pinapp-cinema-loader__hud" aria-hidden="true">
          <span class="pinapp-cinema-loader__corner pinapp-cinema-loader__corner--tl"></span>
          <span class="pinapp-cinema-loader__corner pinapp-cinema-loader__corner--tr"></span>
          <span class="pinapp-cinema-loader__corner pinapp-cinema-loader__corner--bl"></span>
          <span class="pinapp-cinema-loader__corner pinapp-cinema-loader__corner--br"></span>
          <div class="pinapp-cinema-loader__voice" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        function hideLoader() {
          var l = document.getElementById('pandora-loader');
          if (l && l.parentNode) {
            var _pinappV = l.querySelector('video');
            if (_pinappV)
              try {
                _pinappV.pause();
              } catch (_e) {}
            l.style.opacity = '0';
            setTimeout(function () {
              if (l.parentNode) l.remove();
            }, 400);
          }
        }
        window.addEventListener('load', hideLoader);
        setTimeout(hideLoader, 2000);
      })();
    </script>
    <div class="aurora-mobile" aria-hidden="true">
      <div class="aurora-orb aurora-orb-1"></div>
      <div class="aurora-orb aurora-orb-2"></div>
      <div class="aurora-orb aurora-orb-3"></div>
      <div class="aurora-orb aurora-orb-4"></div>
    </div>
    <div class="pandora-shapes" aria-hidden="true">
      <div class="pandora-shape pandora-shape-1"></div>
      <div class="pandora-shape pandora-shape-2"></div>
      <div class="pandora-shape pandora-shape-3"></div>
      <div class="pandora-shape pandora-shape-4"></div>
    </div>
    <div class="holo-grid" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <main id="main" class="og-card" tabindex="-1">
      <img
        class="og-brand-logo"
        src="assets/images/pinapp-logo.png"
        alt="Pinapp"
        width="320"
        height="88"
        decoding="async" / loading="lazy">
      <h1>Pinapp Studio</h1>
      <p>Je pense le système. Je le construis. Vous récoltez.</p>
      <p class="label" style="opacity: 0.8">pinapp.fr</p>
    </main>
    <script src="assets/js/pandora-night.js" defer></script>
    <script src="assets/js/particles.js" defer></script>
    <script src="assets/js/cursor.js" defer></script>
    <script src="assets/js/intelligence.js" defer></script>
    <script src="assets/js/scroll-cinema.js" defer></script>
    <script src="assets/js/bio-particles.js" defer></script>
    <script src="/assets/js/pinapp-master-v3.js" defer></script>
    <script src="/assets/js/pinapp-master-v4.js" defer></script>
  </body>
</html>
