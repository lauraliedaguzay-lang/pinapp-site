<!DOCTYPE html>
<html lang="fr">
<head>
<script>
(function(){var s=localStorage.getItem('pinapp-mode');var d=window.matchMedia('(prefers-color-scheme:dark)').matches;var m=s||(d?'nuit':'jour');document.documentElement.setAttribute('data-mode',m);if(document.body)document.body.classList.add('mode-'+m);document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('mode-'+m);});}());
</script>
  <meta charset="UTF-8">
  <meta name="theme-color" id="pinapp-theme-color" content="#050A14">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OG image — Pinapp Studio</title>
  <link rel="stylesheet" href="assets/variables.css">
  <link rel="stylesheet" href="assets/grid.css">
  <style>
    body { margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center; }
    .og-card {
      width: 1200px; height: 630px; max-width: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; text-align: center;
      background: var(--bg-card); border: 1px solid var(--border-card);
      border-radius: var(--radius-card-lg);
    }
    .og-card h1 { font-size: 3rem; letter-spacing: -0.02em; }
    .og-card p { font-size: 1.25rem; opacity: 0.7; max-width: 36rem; }
    .og-card .og-brand-logo { width: auto; height: 5.5rem; max-width: 22rem; object-fit: contain; }
  </style>
</head>
<body>
  <div class="og-card">
    <svg width="30" height="36" viewBox="0 0 32 38" fill="none" aria-hidden="true" style="flex-shrink:0;">
          <g stroke="#00E5CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 2 C13 5 10 6 11 9"/>
            <path d="M16 2 L16 9"/>
            <path d="M16 2 C19 5 22 6 21 9"/>
            <ellipse cx="16" cy="24" rx="9" ry="12"/>
            <path d="M7 20 L16 15 L25 20 L16 25 Z"/>
            <path d="M7 26 L16 21 L25 26 L16 31 Z"/>
          </g>
        </svg><span style="font-size:16px;font-weight:600;letter-spacing:-0.02em;color:var(--text);">Pinapp</span>
    <h1>Pinapp Studio</h1>
    <p>Je pense le système. Je le construis. Vous récoltez.</p>
    <p class="label" style="opacity:0.8;">pinapp.fr</p>
  </div>
</body>
</html>
