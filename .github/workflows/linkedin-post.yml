name: '📱 Post LinkedIn'

on:
  schedule:
    - cron: '0 8 * * 3' # mercredi ~9–10h Europe/Paris (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini post
        id: claude
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          read -r -d '' PROMPT <<'PROMPT_EOF' || true
          Génère un post LinkedIn PRÊT À PUBLIER pour Pinapp (studio digital Bordeaux).
          Lauralie = dev IA. Michaël = graphiste vidéaste.
          Services : sites premium (2500-8000€), automatisation n8n, films IA (1000-3500€), formations.
          Audience : artisans, commerçants, TPE, indépendants Bordeaux/Nouvelle-Aquitaine.

          Le post :
          - Français, 150-250 mots
          - Hook accrocheur ligne 1 (question ou stat choc)
          - Storytelling court (coulisses, avant/après, cas client fictif réaliste)
          - CTA clair à la fin
          - 3-5 hashtags
          - PAS de ton corporate, parler comme un humain

          Thèmes (alterne chaque semaine) :
          1. Coulisses création site cinématique
          2. Film IA : 10 photos → court-métrage
          3. Automatisation qui fait gagner du temps
          4. Conseil business concret pour TPE
          5. Avant/après transformation digitale

          Format Telegram :

          📱 POST LINKEDIN — copie-colle et publie

          ═══════════════
          [LE POST COMPLET]
          ═══════════════

          📸 IMAGE SUGGÉRÉE : [quelle image/screenshot utiliser]

          🎯 ÉTAPES :
          1. Copie le texte
          2. Va sur linkedin.com/feed
          3. Colle le texte
          4. Ajoute l image suggérée
          5. Publie
          ⏱️ 3 minutes
          PROMPT_EOF

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::GEMINI_API_KEY absent — ajoutez-le dans Settings > Secrets"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY="$(jq -n --arg p "$PROMPT" '{contents:[{parts:[{text:$p}]}],generationConfig:{maxOutputTokens:1500,temperature:0.7}}')"
          RESPONSE="$(curl -sS "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            -d "$BODY")"
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::notice::Gemini API erreur — Telegram skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | head -c 4000)"
          if [ -z "$MSG" ]; then
            echo "::notice::Reponse Anthropic vide — Telegram skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'msg<<EOFMSG'
            printf '%s\n' "$MSG"
            echo 'EOFMSG'
          } >> "$GITHUB_OUTPUT"

      - name: Send
        if: steps.claude.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN_PINAPP: ${{ secrets.TELEGRAM_BOT_TOKEN_PINAPP }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ steps.claude.outputs.msg }}
        run: |
          set -euo pipefail
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN_PINAPP}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
