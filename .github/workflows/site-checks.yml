# Vérifie le site à chaque push / PR (aligné sur le job de build Pages)
name: Site — vérifications

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fichiers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Dépendances
        run: npm install

      - name: Prettier + garde-fous
        run: npm run ci
