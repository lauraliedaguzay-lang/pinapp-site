name: '🚀 Deploy intelligent'

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changes
        id: ch
        run: |
          set -euo pipefail
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            FILES="$(git diff --name-only HEAD~1 HEAD | head -20 | tr '\n' ', ')"
          else
            FILES="(premier commit ou historique insuffisant)"
          fi
          SUBJECT="$(git log -1 --pretty=%s)"
          {
            echo "files=${FILES}"
            echo "msg<<EOFMSG"
            printf '%s\n' "${SUBJECT}"
            echo "EOFMSG"
            echo "sha=${GITHUB_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Gemini analyze
        id: claude
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MSG: ${{ steps.ch.outputs.msg }}
          FILES: ${{ steps.ch.outputs.files }}
          SHA_SHORT: ${{ steps.ch.outputs.sha }}
        run: |
          set -euo pipefail
          PROMPT="Push sur pinapp-site. Commit: ${COMMIT_MSG}. Fichiers: ${FILES}. SHA: ${SHA_SHORT}.

          Message Telegram COURT :
          🚀 DEPLOY [${SHA_SHORT}]
          📝 [résumé 1 ligne]
          ✅ VÉRIFIER : [URL exacte à tester + quoi regarder]
          ⏭️ PROCHAINE ÉTAPE : [quoi faire maintenant]
          Si CSS/JS modifié → rappeler Ctrl+Shift+R"

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::GEMINI_API_KEY absent — ajoutez-le dans Settings > Secrets"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY="$(jq -n --arg p "$PROMPT" '{contents:[{parts:[{text:$p}]}],generationConfig:{maxOutputTokens:500,temperature:0.7}}')"
          RESPONSE="$(curl -sS "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            -d "$BODY")"
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::notice::Gemini API erreur — Telegram skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | head -c 2000)"
          if [ -z "$MSG" ]; then
            echo "::notice::Reponse Anthropic vide — Telegram skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'msg<<EOFMSG'
            printf '%s\n' "$MSG"
            echo 'EOFMSG'
          } >> "$GITHUB_OUTPUT"

      - name: Send
        if: steps.claude.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN_PINAPP: ${{ secrets.TELEGRAM_BOT_TOKEN_PINAPP }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ steps.claude.outputs.msg }}
        run: |
          set -euo pipefail
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN_PINAPP}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
