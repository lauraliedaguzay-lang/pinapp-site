name: '💳 Stripe seed LIVE (one-shot)'
# Déclenchement manuel uniquement.
# Deux modes d'exécution :
#   1. Avec le secret repo STRIPE_SECRET_KEY (recommandé long-terme)
#   2. Avec une clé passée en input (one-shot, scrubbée des logs via ::add-mask::)
# Effet : crée/met à jour les produits + prix + Payment Links des 5 formations
# en mode LIVE, puis commit les fiches HTML mises à jour.
# Idempotent : relançable sans créer de doublon.

on:
  workflow_dispatch:
    inputs:
      stripe_key:
        description: 'sk_live_... (one-shot, sinon utilise le secret repo)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Mask key (si fournie en input)
        if: ${{ inputs.stripe_key != '' }}
        run: echo "::add-mask::${{ inputs.stripe_key }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Stripe seed LIVE
        env:
          STRIPE_SECRET_KEY: ${{ inputs.stripe_key != '' && inputs.stripe_key || secrets.STRIPE_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "✗ Ni l'input stripe_key ni le secret STRIPE_SECRET_KEY ne sont disponibles."
            exit 1
          fi
          node scripts/stripe-seed-live.mjs

      - name: Commit changes (si fichiers modifiés)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à committer (idempotent : produits déjà seedés)."
          else
            git commit -m "chore(stripe): seed live products + update payment links"
            git push
          fi
