# Déploiement automatique sur GitHub Pages à chaque push sur main.
# À activer une fois : dépôt → Settings → Pages → Build : GitHub Actions.
# URL : https://lauraliedaguzay-lang.github.io/pinapp-site/
name: Déployer GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer le dossier publiable (sans outils / config IDE)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tools/' \
            --exclude='.cursor/' \
            --exclude='.cursorrules' \
            --exclude='.gitattributes' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
