# Déploiement GitHub Pages : build reproductible (pinapp.ps1 ci + build) + artefact _site/
# Pages : Settings → Pages → Source : GitHub Actions
# Secret optionnel : AURALIS_APP_URL (URL de l’app SaaS, injectée dans assets/js/auralis-config.js au build)
# Secrets optionnels automatisations : PINAPP_N8N_BASE_URL (ou PINAPP_N8N_HOST), PINAPP_TALLY_DIAGNOSTIC_DEFAULT
# Secret optionnel : HOSTINGER_API_TOKEN — apres chaque deploiement sur main, DNS pinapp.fr -> GitHub Pages (API).
# Sans ce secret : seule la declaration du domaine sur GitHub Pages (API) est appliquee.
name: Déployer GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dépendances
        run: pwsh -NoProfile -File ./pinapp.ps1 install

      - name: Qualité (Prettier + fichiers critiques)
        run: pwsh -NoProfile -File ./pinapp.ps1 ci

      - name: Construire _site/
        env:
          CI: true
          AURALIS_APP_URL: ${{ secrets.AURALIS_APP_URL }}
          PINAPP_N8N_BASE_URL: ${{ secrets.PINAPP_N8N_BASE_URL }}
          PINAPP_N8N_HOST: ${{ secrets.PINAPP_N8N_HOST }}
          PINAPP_TALLY_DIAGNOSTIC_DEFAULT: ${{ secrets.PINAPP_TALLY_DIAGNOSTIC_DEFAULT }}
          PINAPP_DISABLE_AUTOMATION_FEATURES: ${{ secrets.PINAPP_DISABLE_AUTOMATION_FEATURES }}
        run: pwsh -NoProfile -File ./pinapp.ps1 build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pinapp-fr:
    name: pinapp.fr (DNS + domaine API)
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ne pas faire echouer tout le workflow si DNS Hostinger ou PUT Pages a un souci (Pages deja publiee).
      - name: Synchroniser pinapp.fr (Hostinger si secret, GitHub Pages toujours)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          PINAPP_DOMAIN: pinapp.fr
          PAGES_CNAME_TARGET: lauraliedaguzay-lang.github.io.
        run: pwsh -NoProfile -File ./tools/ci/pinapp-fr-sync.ps1
