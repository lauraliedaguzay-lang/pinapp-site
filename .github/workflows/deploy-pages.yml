# Déploiement GitHub Pages : build reproductible (npm run build) + artefact _site/
# Pages : Settings → Pages → Source : GitHub Actions
# Secret optionnel : AURALIS_APP_URL (URL de l’app SaaS, injectée dans assets/js/auralis-config.js au build)
name: Déployer GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dépendances
        run: npm install

      - name: Qualité (Prettier + fichiers critiques)
        run: npm run ci

      - name: Construire _site/
        env:
          CI: true
          AURALIS_APP_URL: ${{ secrets.AURALIS_APP_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
