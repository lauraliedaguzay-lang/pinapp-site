# pinapp.fr : DNS Hostinger + domaine GitHub Pages (API REST).
# Declenchement manuel : Actions > ce workflow > Run workflow.
#
# Secret : HOSTINGER_API_TOKEN (optionnel pour l etape Hostinger ; sans lui, seul GitHub est mis a jour).
# GITHUB_TOKEN : fourni par Actions (permissions pages:write).
#
# Apres chaque push sur main, le workflow « Déployer GitHub Pages » enchaine aussi pinapp-fr (meme script).
name: pinapp.fr (API Hostinger + GitHub)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Zone DNS chez Hostinger
        required: true
        default: pinapp.fr
      pages_cname_target:
        description: Cible CNAME pour www
        required: true
        default: lauraliedaguzay-lang.github.io.
      hostinger_only:
        description: Ne mettre a jour que le DNS Hostinger
        type: boolean
        default: false
      github_only:
        description: Ne declarer que le domaine sur GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: pinapp.fr (API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          PINAPP_DOMAIN: ${{ inputs.domain }}
          PAGES_CNAME_TARGET: ${{ inputs.pages_cname_target }}
          PINAPP_SKIP_HOSTINGER: ${{ inputs.github_only && '1' || '0' }}
          PINAPP_SKIP_GITHUB: ${{ inputs.hostinger_only && '1' || '0' }}
        run: pwsh -NoProfile -File ./tools/ci/pinapp-fr-sync.ps1
