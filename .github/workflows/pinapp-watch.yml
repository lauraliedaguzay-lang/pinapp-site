name: Pinapp — veille (notification)

on:
  schedule:
    - cron: "18 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pinapp-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer dépendances
        run: npm install

      - name: Exécuter la veille
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINAPP_WATCH_ANTHROPIC_API_KEY: ${{ secrets.PINAPP_WATCH_ANTHROPIC_API_KEY }}
          PINAPP_WATCH_MODEL: ${{ vars.PINAPP_WATCH_MODEL }}
          PINAPP_WATCH_REPO: ${{ github.repository }}
        run: node tools/pinapp-watch.mjs
