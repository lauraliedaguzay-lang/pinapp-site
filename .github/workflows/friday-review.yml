name: '🍾 Bilan vendredi'

on:
  schedule:
    - cron: '0 16 * * 5' # vendredi ~17–18h Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Data
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE="$(date -d '7 days ago' -u +%Y-%m-%dT%H:%M:%SZ)"
          C="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits?since=${SINCE}&per_page=100" | jq 'length')"
          echo "commits=${C}" >> "$GITHUB_OUTPUT"

      - name: Gemini review
        id: claude
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          PROMPT="Vendredi 18h. Bilan Pinapp. ${{ steps.d.outputs.commits }} commits cette semaine.

          Message Telegram :
          🍾 BILAN SEMAINE

          ✅ CE QUI A ÉTÉ FAIT [basé sur nb commits, encourageant]

          ❌ CE QUI RESTE [rappeler les tâches en cours : photos, vidéos Micha, LinkedIn, Hostinger]

          📊 ADMIN
          [Rappels : prochaine déclaration URSSAF, factures à envoyer, relances]

          💡 IDÉE SEMAINE PROCHAINE [1 suggestion business]

          🏆 NOTE : X/10 [honnête mais bienveillant]

          🍍 Bon week-end Lauralie & Michaël !

          Si peu de commits = pas de jugement. Si beaucoup = féliciter."

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::GEMINI_API_KEY absent — ajoutez-le dans Settings > Secrets"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BODY="$(jq -n --arg p "$PROMPT" '{contents:[{parts:[{text:$p}]}],generationConfig:{maxOutputTokens:1500,temperature:0.7}}')"
          RESPONSE="$(curl -sS "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            -d "$BODY")"
          if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
            echo "::notice::Gemini API erreur — Telegram skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' | head -c 4000)"
          if [ -z "$MSG" ]; then
            echo "::notice::Reponse Anthropic vide — Telegram skip"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo 'msg<<EOFMSG'
            printf '%s\n' "$MSG"
            echo 'EOFMSG'
          } >> "$GITHUB_OUTPUT"

      - name: Send
        if: steps.claude.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN_PINAPP: ${{ secrets.TELEGRAM_BOT_TOKEN_PINAPP }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ steps.claude.outputs.msg }}
        run: |
          set -euo pipefail
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN_PINAPP}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
