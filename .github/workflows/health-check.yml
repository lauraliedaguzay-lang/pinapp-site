name: Pinapp Health Check
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check homepage
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://pinapp.fr/)
          if [ "$STATUS" != "200" ]; then
            echo "Homepage down: HTTP $STATUS"
            exit 1
          fi
          echo "Homepage OK: HTTP $STATUS"

      - name: Check sitemap
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://pinapp.fr/sitemap.xml)
          if [ "$STATUS" != "200" ]; then
            echo "Sitemap down: HTTP $STATUS"
            exit 1
          fi
          echo "Sitemap OK: HTTP $STATUS"

      - name: Check robots.txt
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://pinapp.fr/robots.txt)
          echo "robots.txt: HTTP $STATUS"

      - name: Check SSL certificate dates
        run: |
          echo | openssl s_client -servername pinapp.fr -connect pinapp.fr:443 2>/dev/null | openssl x509 -noout -dates
          echo "SSL command completed"

      - name: Check response time
        run: |
          export TIME=$(curl -sS -o /dev/null -w "%{time_total}" https://pinapp.fr/)
          echo "Response time: ${TIME}s"
          python3 -c "import os, sys; t=float(os.environ['TIME']); print('seconds', t); sys.exit(1 if t>8 else 0)"
