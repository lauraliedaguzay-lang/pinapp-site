name: "Demande d’amélioration"
description: "Proposer une évolution (UX, contenu, design, perf, SEO…)."
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: contexte
    attributes:
      label: Contexte
      description: "Quel problème / opportunité on résout ?"
      placeholder: "Ex. Les prospects ne comprennent pas la différence entre Starter et Système complet."
    validations:
      required: true

  - type: textarea
    id: objectif
    attributes:
      label: Objectif (résultat attendu)
      placeholder: "Ex. Clarifier le choix en 10 secondes sur mobile."
    validations:
      required: true

  - type: textarea
    id: proposition
    attributes:
      label: Proposition (solution)
      description: "Décrire la solution envisagée."
      placeholder: "Ex. Ajouter un tableau comparatif compact + 1 CTA par offre."
    validations:
      required: true

  - type: textarea
    id: pages
    attributes:
      label: Pages / fichiers concernés
      description: "Liste des pages/fichiers à modifier."
      placeholder: "Ex. index.html, offres/index.html, assets/variables.css"
    validations:
      required: false

  - type: textarea
    id: criteres
    attributes:
      label: Critères d’acceptation
      description: "Checklist testable."
      placeholder: "- Mobile 390px: CTA visible sans scroll\n- Aucun nouveau script lourd\n- Accessibilité OK (focus visible, aria-label)\n"
    validations:
      required: false
