    <script>
      (function () {
        var t = localStorage.getItem('pinapp-theme') || localStorage.getItem('pinapp-mode');
        var d = window.matchMedia('(prefers-color-scheme:dark)').matches;
        var m = t === 'light' || t === 'jour' ? 'jour' : t === 'dark' || t === 'nuit' ? 'nuit' : 'nuit';
        document.documentElement.setAttribute('data-mode', m);
        document.documentElement.setAttribute('data-theme', m === 'jour' ? 'light' : 'dark');
        if (document.body) {
          document.body.classList.add('mode-' + m);
        }
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('mode-' + m);
        });
      })();
    </script>

    <script>
      (function () {
        function hideLoader() {
          var l = document.getElementById('pandora-loader');
          if (l && l.parentNode) {
            var _pinappV = l.querySelector('video');
            if (_pinappV)
              try {
                _pinappV.pause();
              } catch (_e) {}
            l.style.opacity = '0';
            setTimeout(function () {
              if (l.parentNode) l.remove();
            }, 400);
          }
        }
        window.addEventListener('load', hideLoader);
        setTimeout(hideLoader, 2000);
      })();
    </script>
